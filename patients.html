<!DOCTYPE html>
<html>
<head>
<title>Patients</title>

<style>
body{
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container{
    width: 600px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

h2{
    text-align: center;
    color: #2c3e50;
    margin-bottom: 20px;
}

/* Search Bar */
.search{
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 20px;
}

ol{
    padding-left: 20px;
}

ol li{
    background: #eef2ff;
    margin-bottom: 15px;
    padding: 14px;
    border-radius: 10px;
    border-left: 6px solid #4e73df;
    font-weight: 500;
    transition: 0.3s;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

ol li:hover{
    background: #dbe4ff;
    transform: translateX(5px);
    box-shadow: 0 5px 12px rgba(0,0,0,0.1);
}

/* Status Badge */
.status{
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    color: white;
}

.active{
    background: #1cc88a;
}

.inactive{
    background: #e74a3b;
}

.back-btn{
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #858796;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.back-btn:hover{
    background: #6c757d;
}
</style>
</head>

<body>

<div class="container">

<h2>Patient List</h2>

<input type="text" class="search" placeholder="Search patient..." onkeyup="searchPatient()">

<ol id="patientList">
    <!-- Patients will be loaded dynamically -->
</ol>

<button class="back-btn" onclick="window.location.href='dashboard.html'">
    Back to Dashboard
</button>

</div>

<script>
let allPatients = [];

window.onload = function() {
    loadPatients();
};

function loadPatients() {
    fetch('/patients')
    .then(res => res.json())
    .then(data => {
        allPatients = data;
        displayPatients(data);
    })
    .catch(err => console.error('Error loading patients:', err));
}

function displayPatients(patients) {
    const list = document.getElementById('patientList');
    list.innerHTML = '';
    
    patients.forEach((patient, index) => {
        const li = document.createElement('li');
        li.onclick = () => viewPatientDetails(patient.id);
        li.innerHTML = `
            ID${String(patient.id).padStart(3, '0')} - ${patient.name}
            <span class="status ${patient.status === 'active' ? 'active' : 'inactive'}">${patient.status}</span>
        `;
        list.appendChild(li);
    });
}

function viewPatientDetails(patientId) {
    window.location.href = `patient.html?id=${patientId}`;
}

function searchPatient() {
    const input = document.querySelector(".search").value.toLowerCase();
    const filtered = allPatients.filter(patient => 
        patient.name.toLowerCase().includes(input) || 
        patient.id.toString().includes(input)
    );
    displayPatients(filtered);
}
</script>

</body>
</html>
