<!DOCTYPE html>
<html>
<head>
    <title>Patient Details</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; margin-bottom: 30px; }
        .patient-info { margin-bottom: 30px; }
        .vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .vital-card { background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; }
        .vital-card h3 { margin: 0 0 10px 0; color: #4e73df; }
        .vital-card p { margin: 0; font-size: 24px; font-weight: bold; }
        .actions { display: flex; gap: 10px; margin-bottom: 30px; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #4e73df; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-success { background: #1cc88a; color: white; }
        .section { margin-bottom: 30px; }
        .section h3 { color: #2c3e50; border-bottom: 2px solid #4e73df; padding-bottom: 10px; }
        .notes-list { max-height: 300px; overflow-y: auto; }
        .note { background: #f8f9fa; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .note-date { color: #6c757d; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="patientName">Patient Details</h1>
    
    <div class="patient-info" id="patientInfo">
        <!-- Patient info will be loaded here -->
    </div>
    
    <div class="vitals" id="vitals">
        <!-- Vitals will be loaded here -->
    </div>
    
    <div class="actions">
        <button class="btn-primary" onclick="window.location.href='notes.html?patient=' + getPatientId()">Add Notes</button>
        <button class="btn-success" onclick="generateReport()">Generate Report</button>
        <button class="btn-secondary" onclick="window.location.href='chat.html?patient=' + getPatientId()">Chat</button>
        <button class="btn-secondary" onclick="window.location.href='patients.html'">Back to Patients</button>
    </div>
    
    <div class="section">
        <h3>Medical Notes</h3>
        <div class="notes-list" id="notesList">
            <!-- Notes will be loaded here -->
        </div>
    </div>
    
    <div class="section">
        <h3>Upcoming Appointments</h3>
        <div id="appointmentsList">
            <!-- Appointments will be loaded here -->
        </div>
    </div>
</div>

<script>
let currentPatient = null;

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const patientId = urlParams.get('id');
    
    if (patientId) {
        loadPatientDetails(patientId);
        loadPatientNotes(patientId);
        loadPatientAppointments(patientId);
    }
};

function getPatientId() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('id');
}

function loadPatientDetails(id) {
    fetch(`/patients`)
    .then(res => res.json())
    .then(patients => {
        const patient = patients.find(p => p.id == id);
        if (patient) {
            currentPatient = patient;
            displayPatientInfo(patient);
        }
    })
    .catch(err => console.error('Error loading patient:', err));
}

function displayPatientInfo(patient) {
    document.getElementById('patientName').textContent = patient.name;
    
    const infoDiv = document.getElementById('patientInfo');
    infoDiv.innerHTML = `
        <p><strong>ID:</strong> ${String(patient.id).padStart(3, '0')}</p>
        <p><strong>Condition:</strong> ${patient.condition_name}</p>
        <p><strong>Status:</strong> ${patient.status}</p>
    `;
    
    const vitalsDiv = document.getElementById('vitals');
    vitalsDiv.innerHTML = `
        <div class="vital-card">
            <h3>Blood Pressure</h3>
            <p>${patient.blood_pressure || 'N/A'}</p>
        </div>
        <div class="vital-card">
            <h3>Heart Rate</h3>
            <p>${patient.heart_rate || 'N/A'}</p>
        </div>
        <div class="vital-card">
            <h3>Temperature</h3>
            <p>${patient.temperature || 'N/A'}</p>
        </div>
    `;
}

function loadPatientNotes(patientId) {
    fetch(`/notes/${patientId}`)
    .then(res => res.json())
    .then(notes => {
        const notesDiv = document.getElementById('notesList');
        if (notes.length === 0) {
            notesDiv.innerHTML = '<p>No medical notes found.</p>';
            return;
        }
        
        notesDiv.innerHTML = notes.map(note => `
            <div class="note">
                <div class="note-date">${new Date(note.created_at).toLocaleString()}</div>
                <p><strong>Diagnosis:</strong> ${note.diagnosis || 'N/A'}</p>
                <p><strong>Prescription:</strong> ${note.prescription || 'N/A'}</p>
                <p><strong>Comments:</strong> ${note.comments || 'N/A'}</p>
            </div>
        `).join('');
    })
    .catch(err => console.error('Error loading notes:', err));
}

function loadPatientAppointments(patientId) {
    fetch('/appointments')
    .then(res => res.json())
    .then(appointments => {
        const patientAppointments = appointments.filter(apt => apt.patient_id == patientId);
        const aptDiv = document.getElementById('appointmentsList');
        
        if (patientAppointments.length === 0) {
            aptDiv.innerHTML = '<p>No appointments scheduled.</p>';
            return;
        }
        
        aptDiv.innerHTML = patientAppointments.map(apt => `
            <p>${apt.appointment_time} on ${new Date(apt.appointment_date).toLocaleDateString()} - ${apt.status}</p>
        `).join('');
    })
    .catch(err => console.error('Error loading appointments:', err));
}

function generateReport() {
    if (!currentPatient) return;
    
    fetch(`/patient-report/${currentPatient.id}`)
    .then(res => res.json())
    .then(report => {
        // Create a simple text report
        let reportText = `PATIENT HEALTH REPORT\n\n`;
        reportText += `Patient: ${report.patient.name}\n`;
        reportText += `ID: ${report.patient.id}\n`;
        reportText += `Condition: ${report.patient.condition_name}\n`;
        reportText += `Blood Pressure: ${report.patient.blood_pressure}\n`;
        reportText += `Heart Rate: ${report.patient.heart_rate}\n`;
        reportText += `Temperature: ${report.patient.temperature}\n\n`;
        
        reportText += `MEDICAL NOTES:\n`;
        if (report.medical_notes.length === 0) {
            reportText += `No notes available.\n`;
        } else {
            report.medical_notes.forEach(note => {
                reportText += `- ${new Date(note.created_at).toLocaleDateString()}: ${note.diagnosis} - ${note.prescription}\n`;
            });
        }
        
        reportText += `\nAPPOINTMENTS:\n`;
        if (report.appointments.length === 0) {
            reportText += `No appointments scheduled.\n`;
        } else {
            report.appointments.forEach(apt => {
                reportText += `- ${apt.appointment_time} on ${new Date(apt.appointment_date).toLocaleDateString()}\n`;
            });
        }
        
        reportText += `\nGenerated: ${new Date(report.generated_at).toLocaleString()}\n`;
        
        // Download as text file
        const blob = new Blob([reportText], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `patient_report_${report.patient.name.replace(/\s+/g, '_')}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    })
    .catch(err => console.error('Error generating report:', err));
}
</script>

</body>
</html>
