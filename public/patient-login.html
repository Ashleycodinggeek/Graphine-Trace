<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Login - Graphine Trace</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    background: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
}

body::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: moveBackground 20s linear infinite;
    pointer-events: none;
}

@keyframes moveBackground {
    0% { transform: translate(0, 0); }
    100% { transform: translate(50px, 50px); }
}

.login-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-container {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    padding: 50px 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    width: 100%;
    max-width: 420px;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.login-header {
    text-align: center;
    margin-bottom: 40px;
}

.logo-icon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #059669 0%, #10b981 100%);
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 10px 25px rgba(5, 150, 105, 0.3);
}

.logo-icon i {
    color: white;
    font-size: 30px;
}

h1 {
    font-size: 28px;
    color: #1a1a1a;
    margin-bottom: 8px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.subtitle {
    color: #666;
    font-size: 14px;
    font-weight: 500;
}

.role-badge {
    display: inline-block;
    background: linear-gradient(135deg, #059669 0%, #10b981 100%);
    color: white;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 10px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: 600;
    font-size: 14px;
}

input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 14px;
    transition: all 0.3s ease;
    background: #f8f9fa;
}

input[type="text"]:focus,
input[type="password"]:focus {
    outline: none;
    border-color: #059669;
    background: white;
    box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #059669 0%, #10b981 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
    box-shadow: 0 10px 25px rgba(5, 150, 105, 0.2);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(5, 150, 105, 0.3);
}

button:active {
    transform: translateY(0);
}

.error {
    background: #fee;
    border: 2px solid #fcc;
    color: #c00;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    display: none;
    font-size: 14px;
    font-weight: 500;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #999;
    font-size: 12px;
}

.back-link {
    text-align: center;
    margin-top: 15px;
}

.back-link a {
    color: #059669;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
}

.back-link a:hover {
    text-decoration: underline;
}

@media (max-width: 480px) {
    .login-container {
        padding: 35px 25px;
    }

    h1 {
        font-size: 24px;
    }

    .logo-icon {
        width: 50px;
        height: 50px;
    }

    .logo-icon i {
        font-size: 24px;
    }
}
</style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">
                <i class="fas fa-user-circle"></i>
            </div>
            <h1>Patient Portal</h1>
            <p class="subtitle">Graphine Trace Healthcare System</p>
            <div class="role-badge">
                <i class="fas fa-heart"></i> Patient Access
            </div>
        </div>
        
        <div id="error" class="error"></div>
        
        <form id="loginForm" action="/api/patient-login" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your patient username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your patient password" required>
            </div>
            
            <button type="submit">Sign In as Patient</button>
        </form>

        <div class="footer">
            <p>&copy; 2026 Graphine Trace. All rights reserved.</p>
        </div>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('error')) {
    document.getElementById('error').textContent = 'Invalid patient credentials. Please try again.';
    document.getElementById('error').style.display = 'block';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(document.getElementById('loginForm'));
    
    try {
        const response = await fetch('/api/patient-login', {
            method: 'POST',
            body: formData
        });
        
        if (response.ok) {
            window.location.href = '/patient-dashboard.html';
        } else {
            document.getElementById('error').textContent = 'Invalid patient credentials. Please try again.';
            document.getElementById('error').style.display = 'block';
        }
    } catch (error) {
        console.error('Error:', error);
        document.getElementById('error').textContent = 'An error occurred. Please try again.';
        document.getElementById('error').style.display = 'block';
    }
});
</script>

</body>
</html>
